# PhysioRANO Phase 3 Training Configuration Defaults
epochs: 50
learning_rate: 1e-4
weight_decay: 1e-5
batch_size: 2
val_interval: 1
train_val_split: 0.8  # 80% train, 20% val

# Mixed Precision & Optimizer
use_amp: true
max_grad_norm: 1.0

# Scheduler & Early Stopping
scheduler:
  type: cosine
  t_max: ${training.epochs}
  eta_min: 1e-6

early_stopping:
  patience: 10
  min_delta: 0.001

# Inference Window
inference:
  roi_size: [128, 128, 128]
  sw_batch_size: 2
  overlap: 0.25
